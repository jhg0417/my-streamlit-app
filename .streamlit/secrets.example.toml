# Copy to .streamlit/secrets.toml locally (never commit the real file),
# or paste into Streamlit Community Cloud > App settings > Secrets.
OPENAI_API_KEY = "YOUR_OPENAI_API_KEY"
GMAIL_ADDRESS = "your-address@gmail.com"
GMAIL_APP_PASSWORD = "YOUR_GMAIL_APP_PASSWORD"
APP_PASSWORD = "CHOOSE_A_PRIVATE_LOGIN_PASSWORD"

# Recommended for persistent task records on Community Cloud:
# SUPABASE_URL = "https://YOUR_PROJECT.supabase.co"
# SUPABASE_SERVICE_ROLE_KEY = "YOUR_SERVER_ONLY_SERVICE_ROLE_KEY"

# Optional real web search. Without this, the search switch stays disabled.
# TAVILY_API_KEY = "YOUR_TAVILY_KEY"
